<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="QueryLens: the Ask path and the Analyze path">
  <style>
    .bg    { fill:#141b24; stroke:#242e3a; }
    .box   { fill:#1e2833; stroke:#2f3b49; }
    .box-a { fill:#241f16; stroke:#d4a655; }
    .box-o { fill:#1b242e; stroke:#3a4756; }
    .t     { font-family:ui-monospace,'Courier New',monospace; font-size:12px; fill:#e8e4dc; text-anchor:middle; }
    .s     { font-family:ui-monospace,'Courier New',monospace; font-size:9.5px; fill:#97a1af; text-anchor:middle; }
    .cap   { font-family:ui-monospace,'Courier New',monospace; font-size:10px; fill:#5c6774; }
    .gold  { fill:#d4a655; }
    .arrow { stroke:#5c6774; stroke-width:1.2; fill:none; }
  </style>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#5c6774"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="599" height="399" rx="6"/>
  <text class="cap" x="20" y="26">querylens &#183; two paths</text>

  <rect class="box-o" x="40" y="52" width="250" height="56" rx="5"/>
  <text class="t" x="165" y="76">Ask</text>
  <text class="s" x="165" y="92">a question in English</text>

  <rect class="box-o" x="310" y="52" width="250" height="56" rx="5"/>
  <text class="t" x="435" y="76">Analyze</text>
  <text class="s" x="435" y="92">SQL you already have</text>

  <path class="arrow" marker-end="url(#ah)" d="M165,108 L165,134"/>
  <path class="arrow" marker-end="url(#ah)" d="M435,108 L435,134"/>

  <rect class="box-a" x="40" y="138" width="250" height="56" rx="5"/>
  <text class="t gold" x="165" y="162">Groq &#183; Llama 3.1 8B</text>
  <text class="s" x="165" y="178">writes the SQL</text>

  <rect class="box" x="310" y="138" width="250" height="56" rx="5"/>
  <text class="t" x="435" y="162">9 regex rules</text>
  <text class="s" x="435" y="178">deterministic, no model</text>

  <path class="arrow" marker-end="url(#ah)" d="M165,194 L165,220"/>
  <path class="arrow" marker-end="url(#ah)" d="M435,194 L435,220"/>

  <rect class="box" x="40" y="224" width="250" height="56" rx="5"/>
  <text class="t" x="165" y="248">SELECT-only check</text>
  <text class="s" x="165" y="264">anything else is rejected</text>

  <rect class="box" x="310" y="224" width="250" height="56" rx="5"/>
  <text class="t" x="435" y="248">Score and grade</text>
  <text class="s" x="435" y="264">0-100, A through F</text>

  <path class="arrow" marker-end="url(#ah)" d="M165,280 L165,306"/>
  <path class="arrow" marker-end="url(#ah)" d="M435,280 L435,306"/>

  <rect class="box-o" x="40" y="310" width="250" height="56" rx="5"/>
  <text class="t" x="165" y="334">PostgreSQL</text>
  <text class="s" x="165" y="350">query and rows come back</text>

  <rect class="box-o" x="310" y="310" width="250" height="56" rx="5"/>
  <text class="t" x="435" y="334">Fix for each finding</text>
  <text class="s" x="435" y="350">what to write instead</text>
</svg>

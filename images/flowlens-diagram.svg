<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470" role="img" aria-label="FlowLens write-audit-publish gate">
  <style>
    .bg    { fill:#141b24; stroke:#242e3a; }
    .box   { fill:#1e2833; stroke:#2f3b49; }
    .box-a { fill:#241f16; stroke:#d4a655; }
    .box-p { fill:#16241e; stroke:#5fbf92; }
    .box-f { fill:#251a1d; stroke:#d9737f; }
    .box-o { fill:#1b242e; stroke:#3a4756; }
    .t     { font-family:ui-monospace,'Courier New',monospace; font-size:12px; fill:#e8e4dc; text-anchor:middle; }
    .s     { font-family:ui-monospace,'Courier New',monospace; font-size:9.5px; fill:#97a1af; text-anchor:middle; }
    .cap   { font-family:ui-monospace,'Courier New',monospace; font-size:10px; fill:#5c6774; }
    .gold  { fill:#d4a655; }
    .green { fill:#5fbf92; }
    .red   { fill:#d9737f; }
    .arrow { stroke:#5c6774; stroke-width:1.2; fill:none; }
  </style>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#5c6774"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="599" height="469" rx="6"/>
  <text class="cap" x="20" y="26">flowlens &#183; write-audit-publish</text>

  <rect class="box" x="190" y="46" width="220" height="48" rx="5"/>
  <text class="t" x="300" y="68">Source batch</text>
  <text class="s" x="300" y="84">nightly ETL load</text>

  <path class="arrow" marker-end="url(#ah)" d="M300,94 L300,120"/>

  <rect class="box" x="190" y="124" width="220" height="48" rx="5"/>
  <text class="t" x="300" y="146">Staging table</text>
  <text class="s" x="300" y="162">written, not yet published</text>

  <path class="arrow" marker-end="url(#ah)" d="M300,172 L300,198"/>

  <rect class="box-a" x="130" y="202" width="340" height="58" rx="5"/>
  <text class="t gold" x="300" y="227">Audit gate</text>
  <text class="s" x="300" y="243">data contracts, reconciliation, IsolationForest</text>

  <path class="arrow" marker-end="url(#ah)" d="M280,260 L160,306"/>
  <path class="arrow" marker-end="url(#ah)" d="M320,260 L440,306"/>

  <rect class="box-p" x="25" y="312" width="250" height="54" rx="5"/>
  <text class="t green" x="150" y="336">PASS</text>
  <text class="s" x="150" y="352">publish to production</text>

  <rect class="box-f" x="325" y="312" width="250" height="54" rx="5"/>
  <text class="t red" x="450" y="336">FAIL</text>
  <text class="s" x="450" y="352">quarantine, production untouched</text>

  <path class="arrow" marker-end="url(#ah)" d="M450,366 L450,394"/>

  <rect class="box-o" x="310" y="398" width="280" height="50" rx="5"/>
  <text class="t" x="450" y="421">Incident report</text>
  <text class="s" x="450" y="437">written from the gate's evidence</text>
</svg>

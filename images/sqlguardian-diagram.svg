<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" width="600" height="410" role="img" aria-label="SQLGuardian data flow: DMV checks and ingested team runbooks both feed the LLM, which produces guided resolution steps and a management summary">
  <style>
    .bg    { fill:#141b24; stroke:#242e3a; }
    .box   { fill:#1e2833; stroke:#2f3b49; }
    .box-a { fill:#241f16; stroke:#d4a655; }
    .box-o { fill:#1b242e; stroke:#3a4756; }
    .t     { font-family:ui-monospace,'Courier New',monospace; font-size:12px; fill:#e8e4dc; text-anchor:middle; }
    .s     { font-family:ui-monospace,'Courier New',monospace; font-size:9.5px; fill:#97a1af; text-anchor:middle; }
    .cap   { font-family:ui-monospace,'Courier New',monospace; font-size:10px; fill:#5c6774; }
    .gold  { fill:#d4a655; }
    .arrow { stroke:#5c6774; stroke-width:1.2; fill:none; }
  </style>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#5c6774"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="599" height="409" rx="6"/>
  <text class="cap" x="20" y="26">sqlguardian &#183; what the on-call engineer gets</text>

  <rect class="box" x="35" y="48" width="250" height="52" rx="5"/>
  <text class="t" x="160" y="70">SQL Server 2022</text>
  <text class="s" x="160" y="86">sys.dm_* views</text>

  <rect class="box" x="315" y="48" width="250" height="52" rx="5"/>
  <text class="t" x="440" y="70">Team SOPs &amp; runbooks</text>
  <text class="s" x="440" y="86">ingested from the team's own docs</text>

  <path class="arrow" marker-end="url(#ah)" d="M160,100 L160,126"/>
  <path class="arrow" marker-end="url(#ah)" d="M440,100 L440,126"/>

  <rect class="box" x="35" y="130" width="250" height="52" rx="5"/>
  <text class="t" x="160" y="152">Collector &#183; FastAPI</text>
  <text class="s" x="160" y="168">7 checks every 60 seconds</text>

  <rect class="box" x="315" y="130" width="250" height="52" rx="5"/>
  <text class="t" x="440" y="152">Procedure knowledge base</text>
  <text class="s" x="440" y="168">this team's steps, not generic ones</text>

  <path class="arrow" marker-end="url(#ah)" d="M160,182 L235,210"/>
  <path class="arrow" marker-end="url(#ah)" d="M440,182 L365,210"/>

  <rect class="box-a" x="100" y="214" width="400" height="56" rx="5"/>
  <text class="t gold" x="300" y="238">GPT-OSS 120b via Groq</text>
  <text class="s" x="300" y="254">matches the firing check to the team's documented procedure</text>

  <path class="arrow" marker-end="url(#ah)" d="M245,270 L165,318"/>
  <path class="arrow" marker-end="url(#ah)" d="M355,270 L435,318"/>

  <rect class="box-o" x="35" y="322" width="260" height="60" rx="5"/>
  <text class="t" x="165" y="346">Guided resolution</text>
  <text class="s" x="165" y="362">head blocker, options by risk, KILL last</text>

  <rect class="box-o" x="305" y="322" width="260" height="60" rx="5"/>
  <text class="t" x="435" y="346">Drafted incident report</text>
  <text class="s" x="435" y="362">technical view + management summary</text>
</svg>

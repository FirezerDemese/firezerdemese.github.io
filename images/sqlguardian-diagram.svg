<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 412" width="600" height="412" role="img" aria-label="SQLGuardian data flow">
  <style>
    .bg    { fill:#141b24; stroke:#242e3a; }
    .box   { fill:#1e2833; stroke:#2f3b49; }
    .box-a { fill:#241f16; stroke:#d4a655; }
    .box-o { fill:#1b242e; stroke:#3a4756; }
    .t     { font-family:ui-monospace,'Courier New',monospace; font-size:12px; fill:#e8e4dc; text-anchor:middle; }
    .s     { font-family:ui-monospace,'Courier New',monospace; font-size:9.5px; fill:#97a1af; text-anchor:middle; }
    .cap   { font-family:ui-monospace,'Courier New',monospace; font-size:10px; fill:#5c6774; }
    .gold  { fill:#d4a655; }
    .arrow { stroke:#5c6774; stroke-width:1.2; fill:none; }
  </style>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#5c6774"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="599" height="411" rx="6"/>
  <text class="cap" x="20" y="26">sqlguardian &#183; data flow</text>

  <rect class="box" x="180" y="52" width="240" height="52" rx="5"/>
  <text class="t" x="300" y="76">SQL Server 2022</text>
  <text class="s" x="300" y="92">sys.dm_* views</text>

  <path class="arrow" marker-end="url(#ah)" d="M300,104 L300,134"/>

  <rect class="box" x="180" y="138" width="240" height="52" rx="5"/>
  <text class="t" x="300" y="162">Collector &#183; FastAPI</text>
  <text class="s" x="300" y="178">7 checks every 60 seconds</text>

  <path class="arrow" marker-end="url(#ah)" d="M300,190 L300,220"/>

  <rect class="box-a" x="150" y="224" width="300" height="52" rx="5"/>
  <text class="t gold" x="300" y="248">Llama 3.3 70b via Groq</text>
  <text class="s" x="300" y="264">reads the snapshot, writes the explanation</text>

  <path class="arrow" marker-end="url(#ah)" d="M280,276 L165,322"/>
  <path class="arrow" marker-end="url(#ah)" d="M320,276 L435,322"/>

  <rect class="box-o" x="30" y="328" width="250" height="56" rx="5"/>
  <text class="t" x="155" y="352">DBA view</text>
  <text class="s" x="155" y="368">blocking chain + remediation T-SQL</text>

  <rect class="box-o" x="320" y="328" width="250" height="56" rx="5"/>
  <text class="t" x="445" y="352">Management summary</text>
  <text class="s" x="445" y="368">one paragraph, plain English</text>
</svg>
